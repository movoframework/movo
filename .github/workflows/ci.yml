name: CI

# The PR gate. This is the only workflow that blocks a merge, so it performs no network I/O
# beyond installing dependencies: a third-party facilitator being down must never turn this
# repository red. Live-service checks live in conformance.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The two compliance gates run before anything expensive: a prohibited licence or a
      # broken track boundary is a stop-work condition, not a test failure.
      - name: Licence gate
        run: pnpm check:licenses

      - name: Track isolation
        run: pnpm check:track-isolation

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test (unit + integration)
        run: pnpm test

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks needs history to scan the commits a PR introduces, not just the tree.
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
