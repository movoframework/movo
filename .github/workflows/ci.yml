name: CI

# The PR gate. This is the only workflow that blocks a merge, so it performs no network I/O
# beyond installing dependencies: a third-party facilitator being down must never turn this
# repository red. Live-service checks live in conformance.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The two compliance gates run before anything expensive: a prohibited licence or a
      # broken track boundary is a stop-work condition, not a test failure.
      - name: Licence gate
        run: pnpm check:licenses

      - name: Track isolation
        run: pnpm check:track-isolation

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # After the build, because both gates resolve `@movoframework/core` and a stale tree
      # would make their failures read as documentation problems rather than build problems.
      - name: Error reference is in sync with the registry
        run: pnpm check:errors

      - name: Documentation code blocks compile
        run: pnpm check:docs

      - name: Test (unit + integration)
        run: pnpm test

  # Sibling of `verify` with no `needs:` — a secret scan must not be gated behind a build.
  # We invoke the gitleaks binary directly rather than gitleaks/gitleaks-action: only the
  # action wrapper is EULA-encumbered and demands a paid GITLEAKS_LICENSE for org-owned
  # repositories, while the binary itself stays MIT. Pulling an EULA-gated dependency into
  # the same CI that runs our own licence gate is not something we are willing to do.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bump this pin deliberately: read the release notes, then update the checksum below
      # from the release's gitleaks_<version>_checksums.txt. Never track `latest` — a scanner
      # that silently changes version changes what the gate means.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans commits, not just the tree. A shallow clone would scan almost no
          # history and report clean, which is worse than not scanning at all.
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        shell: bash
        # `git` is the v8 subcommand for scanning history; the old `detect` no longer exists.
        # --redact is load-bearing: without it a detection prints the secret into a public
        # CI log, turning the detection itself into the disclosure.
        run: gitleaks git . --redact --exit-code 1 --no-banner --verbose
