name: CI

# The PR gate. This is the only workflow that blocks a merge, so it performs no network I/O
# beyond installing dependencies: a third-party facilitator being down must never turn this
# repository red. Live-service checks live in conformance.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]

    # AC7.10 is "the same suite passes against both backends", and without a Postgres here the
    # Postgres half skipped — around thirty tests reported as green while never executing. That
    # is the half that found `"extensions ? ?"` eating the jsonb operator, a syntax error on
    # every filtered query in code that typechecked. A container is local to the runner, so this
    # does not breach the no-network-I/O rule above: nothing third-party has to be up.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movo
          POSTGRES_PASSWORD: movo
          POSTGRES_DB: movo_catalog_test
        ports:
          - 5432:5432
        # Without the health check the suite races the container's first-boot initdb and fails
        # on connection refused, which reads as a broken store rather than a cold database.
        options: >-
          --health-cmd "pg_isready -U movo -d movo_catalog_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      # Read by tests/support/catalog-stores.ts. `tests/unit/catalog-postgres-ci.test.ts` fails
      # the job if this is ever unset while CI is true, so deleting the service above turns the
      # build red rather than turning thirty tests back into silent skips.
      MOVO_CATALOG_TEST_POSTGRES_URL: postgres://movo:movo@localhost:5432/movo_catalog_test

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The two compliance gates run before anything expensive: a prohibited licence or a
      # broken track boundary is a stop-work condition, not a test failure.
      - name: Licence gate
        run: pnpm check:licenses

      - name: Track isolation
        run: pnpm check:track-isolation

      - name: Protocol purity
        run: pnpm check:protocol-purity

      - name: Upstream validators (AC4.8)
        run: pnpm check:upstream-validators

      # Before the typecheck, because a missing project reference makes `tsc --build` fail with
      # an unresolved-module error that reads as a broken import rather than a build-order bug.
      - name: Project references
        run: pnpm check:project-references

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # After the build, because both gates resolve `@movoframework/core` and a stale tree
      # would make their failures read as documentation problems rather than build problems.
      - name: Error reference is in sync with the registry
        run: pnpm check:errors

      - name: Documentation code blocks compile
        run: pnpm check:docs

      - name: Test (unit + integration)
        run: pnpm test

      # The scaffold templates are workspace members, so their generated tests run here too.
      # This is what keeps them honest: a template that stops compiling against the current API
      # is the first code a new user reads, and it would otherwise rot invisibly.
      - name: Test (scaffold templates)
        run: pnpm test:templates

  # §E.3(1). The nDCG@10 and recall@20 floors existed from M7 but no workflow ran them, so the
  # ranker could regress to nothing and every published search number would stay green — the
  # inert-`maxTotalSpend` defect at the enforcement layer. This job is a required check.
  #
  # It runs the **lexical-only** configuration, which has floors of its own (0.55 / 0.75). The
  # hybrid configuration needs the MiniLM weights fetched from the Hugging Face hub at first
  # run, and a required check that goes red when a third party's CDN is down is exactly what the
  # header of this file forbids. The hybrid floors are enforced by `pnpm test:search-eval` in the
  # Conformance workflow, where network I/O is permitted and a failure does not block a merge.
  search-eval:
    name: search eval floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Search eval floor
        run: pnpm test:search-eval:ci

      # The proof-of-failure, run in the same job as the gate it proves. It re-runs the identical
      # stack with the fused ranking reversed and succeeds only when the floors *reject* it. A
      # floor quietly lowered until it passes anything makes this step fail, which is the only
      # way a gate can defend its own meaning rather than merely its exit code.
      - name: Proof of failure — a degraded ranking must be rejected
        run: pnpm test:search-eval:proof

  # Sibling of `verify` with no `needs:` — a secret scan must not be gated behind a build.
  # We invoke the gitleaks binary directly rather than gitleaks/gitleaks-action: only the
  # action wrapper is EULA-encumbered and demands a paid GITLEAKS_LICENSE for org-owned
  # repositories, while the binary itself stays MIT. Pulling an EULA-gated dependency into
  # the same CI that runs our own licence gate is not something we are willing to do.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Bump this pin deliberately: read the release notes, then update the checksum below
      # from the release's gitleaks_<version>_checksums.txt. Never track `latest` — a scanner
      # that silently changes version changes what the gate means.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          # gitleaks scans commits, not just the tree. A shallow clone would scan almost no
          # history and report clean, which is worse than not scanning at all.
          fetch-depth: 0

      - name: Install gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan
        shell: bash
        # `git` is the v8 subcommand for scanning history; the old `detect` no longer exists.
        # --redact is load-bearing: without it a detection prints the secret into a public
        # CI log, turning the detection itself into the disclosure.
        run: gitleaks git . --redact --exit-code 1 --no-banner --verbose
