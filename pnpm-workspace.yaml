packages:
  - "packages/*"
  - "apps/*"
  - "examples/*"
  # Templates are real workspace members so CI compiles, lints and tests them. A template
  # kept outside the matrix rots within weeks, and rots invisibly.
  - "packages/create-movo-app/templates/*"

# Only these packages are permitted to run install lifecycle scripts. Everything
# else installs inert. This is a supply-chain control (spec §14): a malicious
# transitive dependency cannot execute code at install time unless it is named here.
onlyBuiltDependencies:
  - "@biomejs/biome"
  - "esbuild"
